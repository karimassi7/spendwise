[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spendwise"
version = "0.1.0"
description = "A command-line personal finance application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mysql-connector-python>=9.0,<10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
spendwise = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
database = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
