[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spendwise"
version = "0.1.0"
description = "A web-based personal finance application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "flask>=3.0",
    "flask_wtf",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
spendwise = "webapp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
database = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
