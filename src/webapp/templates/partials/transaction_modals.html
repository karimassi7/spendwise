<!-- Add income modal -->
<div class="modal fade" id="addIncomeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{{ url_for('transaction.add_income') }}">
        <div class="modal-header bg-success-subtle"><h5 class="modal-title">Add Income</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Account</label>
            <select class="form-select" name="account_id" required>
              <option value="">Select account</option>
              {% for a in accounts %}<option value="{{ a.account_id }}">{{ a.name }} (balance {{ a.balance }})</option>{% endfor %}
            </select></div>
          <div class="mb-3"><label class="form-label">Category</label>
            <select class="form-select" name="category_id" required>
              <option value="">Select category</option>
              {% for c in income_categories %}<option value="{{ c.category_id }}">{{ c.name }}</option>{% endfor %}
            </select></div>
          <div class="mb-3"><label class="form-label">Amount</label>
            <input type="number" step="0.01" min="0.01" class="form-control" name="amount" required></div>
          <div class="mb-3"><label class="form-label">Description</label>
            <input type="text" class="form-control" name="description" required></div>
          <div class="mb-3"><label class="form-label">Date</label>
            <input type="date" class="form-control" name="transaction_date" value="{{ today }}" required></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Add Income</button>
        </div>
      </form>
    </div>
  </div>
</div>
