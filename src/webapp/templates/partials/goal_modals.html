<!-- Create goal modal -->
<div class="modal fade" id="createGoalModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{{ url_for('goal.create') }}">
        <div class="modal-header"><h5 class="modal-title">New Savings Goal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Goal name</label>
            <input type="text" class="form-control" name="name" required></div>
          <div class="mb-3"><label class="form-label">Target amount</label>
            <input type="number" step="0.01" min="0.01" class="form-control" name="target_amount" required></div>
          <div class="mb-3"><label class="form-label">Initial saved</label>
            <input type="number" step="0.01" min="0" class="form-control" name="saved_amount" value="0"></div>
          <div class="mb-3"><label class="form-label">Deadline</label>
            <input type="date" class="form-control" name="deadline" required></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Edit goal modal -->
<div class="modal fade" id="editGoalModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="" id="editGoalForm">
        <div class="modal-header"><h5 class="modal-title">Edit Goal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Goal name</label>
            <input type="text" class="form-control" name="name" id="eg-name" required></div>
          <div class="mb-3"><label class="form-label">Target amount</label>
            <input type="number" step="0.01" min="0.01" class="form-control" name="target_amount" id="eg-target" required></div>
          <div class="mb-3"><label class="form-label">Saved amount</label>
            <input type="number" step="0.01" min="0" class="form-control" name="saved_amount" id="eg-saved"></div>
          <div class="mb-3"><label class="form-label">Deadline</label>
            <input type="date" class="form-control" name="deadline" id="eg-deadline" required></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Contribute modal -->
<div class="modal fade" id="contributeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="" id="contributeForm">
        <div class="modal-header"><h5 class="modal-title">Add contribution</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <p class="text-muted">Contribute toward <strong id="contribute-goal-name"></strong></p>
          <div class="mb-3"><label class="form-label">Amount</label>
            <input type="number" step="0.01" min="0.01" class="form-control" name="amount" required></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>
