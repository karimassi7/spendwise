{% extends 'base.html' %}
{% block title %}Sign in - SpendWise{% endblock %}
{% block authcontent %}
<div class="text-center mb-4">
  <div class="auth-logo"><i class="bi bi-wallet2"></i></div>
  <h1 class="h4 mb-1">Welcome back</h1>
  <p class="text-muted mb-0">Sign in to your SpendWise account</p>
</div>
<form method="post" action="{{ url_for('auth.login') }}">
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" name="email" required autofocus>
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input type="password" class="form-control" id="password" name="password" required>
  </div>
  <button type="submit" class="btn btn-primary w-100">Sign in</button>
</form>
<p class="text-center mt-3 mb-0">
  Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
</p>
{% endblock %}
