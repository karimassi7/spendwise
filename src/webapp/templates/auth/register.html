{% extends 'base.html' %}
{% block title %}Create account - SpendWise{% endblock %}
{% block authcontent %}
<div class="text-center mb-4">
  <div class="auth-logo"><i class="bi bi-wallet2"></i></div>
  <h1 class="h4 mb-1">Create your account</h1>
  <p class="text-muted mb-0">Start managing your money with SpendWise</p>
</div>
<form method="post" action="{{ url_for('auth.register') }}">
  <div class="mb-3">
    <label for="name" class="form-label">Full name</label>
    <input type="text" class="form-control" id="name" name="name" required>
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" name="email" required>
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input type="password" class="form-control" id="password" name="password" minlength="6" required>
    <div class="form-text">At least 6 characters.</div>
  </div>
  <div class="row">
    <div class="col-6 mb-3">
      <label for="currency" class="form-label">Currency</label>
      <select class="form-select" id="currency" name="currency">
        <option value="USD" selected>USD - US Dollar</option>
        <option value="LBP">LBP - Lebanese Pound</option>
      </select>
    </div>
    <div class="col-6 mb-3">
      <label for="monthly_income" class="form-label">Monthly income</label>
      <input type="number" step="0.01" min="0.01" class="form-control" id="monthly_income" name="monthly_income" required>
    </div>
  </div>
  <button type="submit" class="btn btn-primary w-100">Create account</button>
</form>
<p class="text-center mt-3 mb-0">
  Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
</p>
{% endblock %}
