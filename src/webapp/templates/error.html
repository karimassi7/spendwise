{% extends 'base.html' %}
{% block title %}{{ status_code }} - SpendWise{% endblock %}
{% block appcontent %}
<div class="text-center py-5">
  <div class="error-code">{{ status_code }}</div>
  <h1 class="h4">{{ message }}</h1>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-3">Back to Dashboard</a>
</div>
{% endblock %}
{% block authcontent %}
<div class="text-center py-5">
  <div class="error-code">{{ status_code }}</div>
  <h1 class="h4">{{ message }}</h1>
  <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-3">Sign in</a>
</div>
{% endblock %}
